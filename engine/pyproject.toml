[project]
name = "autoedit"
version = "0.3.1"
requires-python = ">=3.12,<3.13"
dependencies = ["claude-agent-sdk==0.2.186", "pillow==13.0.0"]

[project.scripts]
autoedit = "autoedit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyinstaller==6.22.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: needs whisper model or real network"]
addopts = "-m 'not slow'"
